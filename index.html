<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Chatbot IA</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1e1e2e; color: #cdd6f4; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .chat-container { width: 90%; max-width: 500px; background: #252538; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); box-sizing: border-box; }
        h2 { text-align: center; color: #89b4fa; margin-top: 0; }
        #output { background: #181825; border-radius: 8px; padding: 15px; height: 250px; overflow-y: auto; white-space: pre-wrap; margin-bottom: 15px; border: 1px solid #45475a; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #45475a; background: #1e1e2e; color: #cdd6f4; font-size: 16px; outline: none; }
        button { padding: 12px 20px; border-radius: 8px; border: none; background: #89b4fa; color: #11111b; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #b4befe; }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>Minha IA Própria 🤖</h2>
    <div id="output">Olá! Digite sua mensagem abaixo para conversarmos...</div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Digite sua mensagem aqui..." onkeypress="if(event.key === 'Enter') enviarMensagem()">
        <button onclick="enviarMensagem()">Enviar</button>
    </div>
</div>

<script>
    async function enviarMensagem() {
        const inputField = document.getElementById("userInput");
        const outputDiv = document.getElementById("output");
        const mensagem = inputField.value.trim();
        
        if (!mensagem) return;

        outputDiv.innerHTML += `\n\n<b>Você:</b> ${mensagem}`;
        inputField.value = "";
        outputDiv.innerHTML += `\n\n<b>IA:</b> Pensando...`;
        outputDiv.scrollTop = outputDiv.scrollHeight;

        try {
            // Ele faz a requisição automática para a mesma URL do servidor
            const response = await fetch(`/perguntar?mensagem=${encodeURIComponent(mensagem)}`);
            const data = await response.json();
            
            // Remove o "Pensando..." e coloca a resposta real
            outputDiv.innerHTML = outputDiv.innerHTML.replace(`<b>IA:</b> Pensando...`, `<b>IA:</b> ${data.resposta || data.erro}`);
        } catch (error) {
            outputDiv.innerHTML = outputDiv.innerHTML.replace(`<b>IA:</b> Pensando...`, `<b>IA:</b> Erro ao conectar ao servidor.`);
        }
        outputDiv.scrollTop = outputDiv.scrollHeight;
    }
</script>

</body>
</html>
